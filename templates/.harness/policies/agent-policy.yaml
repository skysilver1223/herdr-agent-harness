schema_version: '1.0'
agent_policy:
  # ask    : Provider 기본값. 도구 실행마다 사용자에게 물어본다.
  # auto   : 작업 트리 안의 편집·명령은 묻지 않고 실행한다. 기본값.
  #          트리 밖 쓰기·네트워크처럼 그 범위를 벗어나는 작업의 처리는
  #          Provider마다 다르다 — claude(acceptEdits)는 사용자에게 묻고,
  #          codex(--ask-for-approval never + --sandbox workspace-write)는
  #          묻지 않고 즉시 실패를 모델에 돌려준다. 묻게 하려면 codex_auto를
  #          '--ask-for-approval on-request --sandbox workspace-write'로 바꾼다.
  # bypass : 도구 실행 승인을 전부 건너뛴다. Git 기준선이 있고 write_scope로
  #          범위가 묶인 프로젝트에서만 쓴다.
  approval_mode: '@@APPROVAL_MODE@@'

  # 역할별 오버라이드. 우선순위는 <role>_approval_mode > approval_mode > ask이며,
  # 빈 값은 "미지정"이라 전역 approval_mode로 떨어진다(기본값 = 빈 값 = 종전 동작).
  #
  # 역할마다 필요한 권한이 다를 때 쓴다. Reviewer는 Write Scope가 리뷰 문서로
  # 묶여 있어 셸 명령을 자유롭게 돌려야 하고, Worker는 Provider Sandbox를
  # 유지하는 편이 낫다 — 전역 스칼라 하나로는 Reviewer를 올리려다 Worker의
  # 샌드박스까지 함께 풀린다.
  #
  #   worker_approval_mode: 'auto'      # Worker는 샌드박스 유지
  #   reviewer_approval_mode: 'bypass'  # Reviewer만 승인 화면 없이
  #
  # 이 키는 역할별로 **최소 권한**을 주기 위한 것이지 Worker 등급을 올리는
  # 용도가 아니다. 오버라이드는 허용 인수 목록을 넓히지 않는다 — 선택된 모드의
  # <provider>_<mode> 값은 그대로 같은 검사를 통과해야 한다.
  #
  # 전역 approval_mode와 달리 이 키는 엄격하다. ask|auto|bypass가 아닌 값이면
  # 경고 후 넘어가지 않고 Pane을 만들기 전에 dispatch를 거부한다.
  worker_approval_mode: '@@WORKER_APPROVAL_MODE@@'
  reviewer_approval_mode: '@@REVIEWER_APPROVAL_MODE@@'

  # approval_mode를 Provider CLI 인수로 옮기는 표. dispatch는 이 값을 공백으로
  # 나눠 `herdr agent start ... -- <인수>`로 그대로 넘긴다. 빈 값이면 인수를
  # 붙이지 않는다(= 그 Provider는 ask와 같게 동작한다).
  #
  # Provider CLI가 바뀌면 코드가 아니라 이 표를 고친다. 허용 문자는
  # 영문·숫자와 = _ . / - 뿐이다 — 그 밖의 문자가 있으면 dispatch가 거부한다.
  #
  # 주의: claude의 bypassPermissions는 디렉터리마다 처음 한 번 확인 화면을
  # 띄울 수 있다. 그러면 agent start가 그 화면에서 멈춘다 — 그런 경우 auto
  # (acceptEdits)를 쓰거나, 이미 확인을 마친 디렉터리에서만 bypass를 쓴다.
  claude_auto: '@@CLAUDE_AUTO@@'
  claude_bypass: '@@CLAUDE_BYPASS@@'
  codex_auto: '@@CODEX_AUTO@@'
  codex_bypass: '@@CODEX_BYPASS@@'
  agy_auto: '@@AGY_AUTO@@'
  agy_bypass: '@@AGY_BYPASS@@'

  # 모델·등급·속도는 위 승인 인수와 분리된 타입 있는 경로다. *_models는
  # 공백 구분 허용 목록이자 보안 경계다. 등급 매핑도 목록에 정확히 있어야 한다.
  # 역할 기본 등급/속도를 비우면 레거시 기본 모델 또는 Provider 기본값을 쓴다.
  worker_default_tier: ''
  reviewer_default_tier: ''
  worker_default_effort: ''
  reviewer_default_effort: ''
  claude_models: ''
  claude_default_model: ''
  claude_tier_light: ''
  claude_tier_standard: ''
  claude_tier_premium: ''
  codex_models: ''
  codex_default_model: ''
  codex_tier_light: ''
  codex_tier_standard: ''
  codex_tier_premium: ''
  agy_models: ''
  agy_default_model: ''
  # agy의 속도는 모델 ID에 포함되므로 별도 effort 인수가 없다.
  agy_tier_light: ''
  agy_tier_standard: ''
  agy_tier_premium: ''

  # 프리미엄 판정은 *_tier_premium과 *_premium_models의 합집합이다.
  # 프리미엄은 비용·승인 등급의 선언일 뿐 허용 목록을 넓히지 않는다.
  # 전체 모델 ID를 공백으로 구분하며 *_models와 정확히 일치할 때만 적용 상태다.
  # 목록이 비어 있지 않으면 dispatch가 Provider 기본 모델도 비프리미엄으로
  # 명시 고정하며, 프리미엄 모델은 TASK_ID-model-approval.md의 Task·역할·모델·
  # 승인(yes)이 모두 현재 dispatch와 일치할 때만 사용한다.
  claude_premium_models: ''
  codex_premium_models: ''
  agy_premium_models: ''
