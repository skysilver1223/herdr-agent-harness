schema_version: '2'
task_id: task-000
milestone_id: milestone-000
title: Task 제목
objective: 하나의 검증 가능한 목적
# 필수. Why/What/Not/Constraints/Invariants/Open Questions/Verification Intent 정본
intent: .harness/intents/task-000-intent.md
# status는 harness.sh만 바꾼다. 계획 승인(approve-plan)이 draft → ready로 올린다.
status: draft
primary_worker: '@@WORKER@@'
reviewer: '@@REVIEWER@@'
# 모델 등급: light | standard | premium (비우면 project.yaml models.default_tier)
# premium은 계획 승인 때 사용자가 함께 승인한 Task만 실행된다. 근거는 intent에 적는다.
worker_tier: ''
reviewer_tier: ''
# 모델 직접 지정(선택): 등급보다 우선한다. 사용자가 "이 Task는 opus로"라고 하면 여기에 적는다.
# premium 매핑 모델·매핑에 없는 모델은 계획 승인 표에 적힌 경우에만 쓰인다(approve-plan).
worker_model: ''
reviewer_model: ''
# 생각 깊이: low | medium | high (비우면 models.default_effort)
worker_effort: ''
reviewer_effort: ''
# 목록은 반드시 [a, b] 한 줄 형식. 앞 Task가 교차 검토·통합을 통과하면 시작할 수 있다.
dependencies: []
# 이 Task만 수정하는 경로. 다른 active Task와 겹치면 착수가 거부된다.
write_scope: []
inputs: []
# submitted 때 Harness가 Task 작업 공간에서 직접 실행한다. type: command가 하나 이상 있어야 하며
# 하나라도 실패하면 제출이 거부된다. manual-review는 Reviewer가 직접 확인한다.
# 계획 승인 뒤 이 목록을 바꾸면 approve-plan으로 다시 승인받아야 진행된다.
acceptance_criteria:
  - criterion_id: AC-001
    statement: 검증 가능한 완료 조건
    verified_by:
      type: command
      command: pytest tests/test_feature.py
  - criterion_id: AC-002
    statement: 자동 검증이 불가능한 조건
    verified_by:
      type: manual-review
      instruction: 구체적인 확인 방법
